<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProceMag – Благодарим ви!</title>
    <style>
        :root {
            --primary:       #cc0000;
            --primary-hover: #a30000;
            --dark:          #1e1e1e;
            --light:         #fdfdfd;
            --warm:          #FDF8F3;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 0.9rem 2rem;
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        .logo-dot { color: var(--dark); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--warm);
            padding: 4rem 2rem;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.09);
            padding: 3rem 3.5rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }

        .checkmark {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .checkmark svg { width: 32px; height: 32px; }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: var(--dark);
        }
        p {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .lang-divider {
            border: none;
            border-top: 1px solid #e8e2d5;
            margin: 1.5rem 0;
        }

        .en {
            color: #888;
            font-size: 0.95rem;
        }
        .en h1 { font-size: 1.5rem; color: #555; }
        .en p  { font-size: 0.95rem; color: #888; margin-bottom: 0; }

        .btn-home {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            margin-top: 2rem;
        }
        .btn-home:hover { background: var(--primary-hover); }

        footer {
            background: var(--dark);
            color: #aaa;
            text-align: center;
            padding: 1.2rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="/" class="logo-text">ProceMag<span class="logo-dot">.</span>com</a>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="checkmark">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>

            <h1>Благодарим ви!</h1>
            <p>Съобщението е изпратено.<br>Ще ви отговорим съвсем скоро.</p>

            <hr class="lang-divider">

            <div class="en">
                <h1>Thank you!</h1>
                <p>Your message has been sent.<br>We will get back to you very soon.</p>
            </div>

            <a href="/" class="btn-home">← ProceMag.com</a>
        </div>
    </main>

    <footer>
        &copy; 2026 ProceMag.com
    </footer>

</body>
</html>
